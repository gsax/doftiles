# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$terminal_backup = alacritty
$launcher = foot \
	--font="Monaspace Krypton:size=16.5" \
	--app-id=LAUNCHER ~/.config/hypr/scripts/launcher.sh
$window-switcher = foot \
	--font="Monaspace Krypton:size=16.5" \
	--app-id=WINDOW-SWITCHER ~/.config/hypr/scripts/window-switcher.sh


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = shikane
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprctl setcursor XCursor-Pro-Dark 24
exec-once = hyprctl plugin load "$HYPR_PLUGIN_DIR/lib/libhyprexpo.so"

$wob_socket = $XDG_RUNTIME_DIR/wob.sock

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

cursor {
	hide_on_key_press = true;
}


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 4

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 1

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    dim_inactive = true
    dim_strength = 0.15

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = slave
    allow_small_split = true
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true # If true disables the text at the bottom of the screen
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options = caps:escape_shifted_capslock
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $terminal_backup
bind = $mainMod SHIFT, apostrophe, killactive,
bind = $mainMod SHIFT ALT, q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, v, togglefloating
bind = $mainMod, f, fullscreenstate, 1, 0
bind = $mainMod SHIFT, f, fullscreen
bind = $mainMod ALT, f, fullscreenstate, 2, 0
bind = $mainMod, o, exec, $launcher
bind = $mainMod, p, exec, $window-switcher
bind = ALT, Tab, hyprexpo:expo, toggle
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Switch between the last focused windows with SUPER + TAB
bind = $mainMod, TAB, focuscurrentorlast
# Move focus with mainMod + arrow keys
bind = $mainMod ALT, h, movefocus, l
bind = $mainMod ALT, l, movefocus, r
bind = $mainMod ALT, k, movefocus, u
bind = $mainMod ALT, j, movefocus, d
bind = $mainMod, j, layoutmsg, cyclenext
bind = $mainMod, k, layoutmsg, cycleprev
bind = $mainMod, l, layoutmsg, focusmaster master

bind = $mainMod, h, layoutmsg, swapwithmaster master
bind = $mainMod SHIFT, j, layoutmsg, swapnext
bind = $mainMod SHIFT, k, layoutmsg, swapprev
bind = $mainMod, n, layoutmsg, addmaster
bind = $mainMod SHIFT, n, layoutmsg, removemaster

bind = $mainMod SHIFT ALT, h, movewindow, l
bind = $mainMod SHIFT ALT, l, movewindow, r
bind = $mainMod SHIFT ALT, k, movewindow, u
bind = $mainMod SHIFT ALT, j, movewindow, d

# bind = $mainMod ALT, h, layoutmsg, orientationleft
# bind = $mainMod ALT, l, layoutmsg, orientationright
# bind = $mainMod ALT, j, layoutmsg, orientationbottom
# bind = $mainMod ALT, k, layoutmsg, orientationtop
# bind = $mainMod ALT, semicolon, layoutmsg, orientationcenter
bind = $mainMod, u, layoutmsg, orientationnext
bind = $mainMod, i, layoutmsg, orientationprev
bind = $mainMod, w, layoutmsg, mfact -0.05
bind = $mainMod, e, layoutmsg, mfact +0.05
bind = $mainMod, equal, layoutmsg, mfact exact 0.5

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# bind = $mainMod, bracketleft, workspace, 11
# bind = $mainMod, bracketright, workspace, 12

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, \
    wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && \
    pactl get-sink-volume @DEFAULT_SINK@ | head -n 1 | \
    awk '{print substr($5, 1, length($5)-1)}' > $wob_socket
bindel = ,XF86AudioLowerVolume, exec,  \
    wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && \
    pactl get-sink-volume @DEFAULT_SINK@ | head -n 1 | \
    awk '{print substr($5, 1, length($5)-1)}' > $wob_socket
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, \
    brightnessctl -e set +2% && brightnessctl info | \
    sed -ne 's/^.*(//' -e 's/%).*$//p' > $wob_socket
bindel = ,XF86MonBrightnessDown, exec, \
    brightnessctl -e set 2%- && brightnessctl info | \
    sed -ne 's/^.*(//' -e 's/%).*$//p' > $wob_socket
bind = ,XF86Display, exec, wdisplays
bind = ,XF86HangupPhone, exec, hyprlock
bind = ,XF86Favorites, exec, systemctl suspend-then-hibernate && hyprlock
bindl = ,switch:on:Lid Switch, exec, hyprlock

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# notifications
bind = $mainMod, grave, exec, makoctl dismiss
bind = $mainMod SHIFT, grave, exec, makoctl restore
bind = $mainMod, d, exec, \
    notify-send \
    -u normal \
    -i /etc/profiles/per-user/gsx/share/icons/Dracula/symbolic/apps/office-calendar-symbolic.svg \
    "$(date +'%Y-%m-%d')" \
    "$(date +'%H:%M KW%V')" 
bind = $mainMod, b, exec, \
    notify-send \
    -u low \
    -i /etc/profiles/per-user/gsx/share/icons/Dracula/symbolic/devices/battery-symbolic.svg \
    "$(cat /sys/class/power_supply/BAT0/status)" \
    "$(cat /sys/class/power_supply/BAT0/capacity)%"

# screenshots
bind = ,Print, exec, ~/.config/hypr/scripts/screenshot_selected_region
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot_focused_display
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot_focused_window
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot_ocr

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# make the launcher floating
windowrule {
    name = launcher
    match:class = LAUNCHER
    float = yes
    move = 50 50
    size = 300 500
}

# make the window-switcher floating
windowrule {
    name = window-switcher
    match:class = WINDOW-SWITCHER
    float = yes
    center = on
    size = 1000 500
}

plugin {
    # hyprexpo
    hyprexpo {
        columns = 3
	gap_size = 12
	workspace_method =  first 1
	skip_empty = true
    }
}
